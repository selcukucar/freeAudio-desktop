name: Build Windows desktop release
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Restore pinned audio dependencies
        run: python tools/fetch_vendor.py
      - name: Run regression tests
        env:
          FREEAUDIO_SKIP_AUDIO_DEVICE_TEST: '1'
        run: python -m unittest discover -s tests -v
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c 'from desktop.version import VERSION; print(VERSION)'
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and source version differ' }
      - name: Build packages
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($compiler) { $compilerPath = $compiler.Source }
          else { $compilerPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path -LiteralPath $compilerPath)) { throw 'Inno Setup compiler is required on the runner' }
          python build.py --build-dir .build --output-dir releases --iscc $compilerPath
      - name: Verify package integrity
        run: python tools/verify_release.py releases
      - name: Verify installed upgrade preserves the profile
        run: python tools/check_installer_upgrade.py
      - name: Preserve packages for manual builds
        uses: actions/upload-artifact@v7
        with:
          name: freeAudio-Desktop-windows
          path: releases/*
          if-no-files-found: error
      - name: Publish verified release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c 'from desktop.version import VERSION; print(VERSION)'
          $tag = "v$version"
          $assets = @(Get-ChildItem releases -File | Where-Object { $_.Extension -in '.zip','.exe','.txt' } | ForEach-Object FullName)
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; verified build artifacts are preserved above.'; exit 0 }
          $prerelease = @()
          if ($tag -match 'alpha|beta|rc') { $prerelease = @('--prerelease') }
          $notes = (Get-Content CHANGELOG.md -Raw) -split "(?m)^# ", 3
          ("# " + $notes[1]).Trim() | Set-Content release-notes.md -Encoding utf8
          gh release create $tag @assets --target $env:GITHUB_SHA @prerelease --title "freeAudio Desktop $version" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
